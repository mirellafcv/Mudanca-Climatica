<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GREEN RATS - Login & Passaporte</title>

  <!-- Vinculação do arquivo de estilos externo separado -->
  <link rel="stylesheet" href="../static/style.css">
</head>
<body>

  <!-- CONTAINER PRINCIPAL DO CARD DE ACESSO -->
  <main class="auth-card">

    <!-- CABEÇALHO DO APLICATIVO -->
    <header>
      <h1 class="title-main">GREEN RATS</h1>
      <p class="subtitle">Conecte-se. Impacte. Reflita.</p>
    </header>

    <!-- NAVEGAÇÃO POR ABAS (LOGIN E CADASTRO) -->
    <nav class="tab-group" id="tabNav">
      <button class="tab-btn active" onclick="alternarAba('login')">ENTRAR</button>
      <button class="tab-btn" onclick="alternarAba('cadastro')">CRIAR CONTA</button>
    </nav>

    <!-- ===================================================================
         1. FORMULÁRIO DE LOGIN
         =================================================================== -->
    <form id="formLogin" onsubmit="realizarLogin(event)">
      <div class="form-group">
        <label for="loginEmail">E-mail do Usuário</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label for="loginSenha">Senha da Conta</label>
        <input type="password" id="loginSenha" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">ENTRAR</button>
    </form>

    <!-- ===================================================================
         2. FORMULÁRIO DE CADASTRO
         =================================================================== -->
    <form id="formCadastro" class="hidden" onsubmit="realizarCadastro(event)">
      <div class="form-group">
        <label for="cadNome">Green Tag (Username)</label>
        <input type="text" id="cadNome" placeholder="Ex: @green_runner" required>
      </div>

      <div class="form-group">
        <label for="cadEmail">Seu E-mail</label>
        <input type="email" id="cadEmail" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label for="cadSenha">Nova Chave de Acesso</label>
        <input type="password" id="cadSenha" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">CRIAR</button>
    </form>

<!-- FOOTER DA ABA DE CADASTRO -->
      <footer class="cad-footer">
        <p>GREEN RATS | Formatura Kodland</p>
        <p class="author">Desenvolvido por Mirella Vilhena</p>
      </footer>
    </form>

    <!-- ===================================================================
         3. PASSAPORTE URBANO DO USUÁRIO (SÓ EXIBIDO APÓS AUTENTICAÇÃO)
         =================================================================== -->
    <section id="cartaoPassaporte" class="pass-card">
      <header class="pass-header">
        <span style="color: var(--cor-laranja); font-size: 0.75rem; font-weight: bold;">[ GREEN PASS VERIFICADO ]</span>
        <div class="user-tag" id="exibeNomeUsuario">@USUARIO</div>
      </header>

      <article style="display: flex; justify-content: space-around; margin-bottom: 15px;">
        <div>
          <!-- Os números utilizam a fonte 'Space Mono' através do CSS -->
          <div class="pass-stat-value" id="exibeStreak">01</div>
          <div class="pass-stat-label">Dias de Streak</div>
        </div>
        <div>
          <div class="pass-stat-value" id="exibeNivel">100</div>
          <div class="pass-stat-label">Pontos Green</div>
        </div>
      </article>

      <button type="button" class="btn-submit" onclick="sairApp()">SAIR DA CONTA</button>
    </section>

  </main>

  <!-- ===================================================================
       LÓGICA JAVASCRIPT SIMPLIFICADA E COMENTADA
       =================================================================== -->
  <script>
    // Alterna visualmente entre as abas de Login e Cadastro
    function alternarAba(aba) {
      const formLogin = document.getElementById('formLogin');
      const formCadastro = document.getElementById('formCadastro');
      const botoes = document.querySelectorAll('.tab-btn');

      if (aba === 'login') {
        formLogin.classList.remove('hidden');
        formCadastro.classList.add('hidden');
        botoes[0].classList.add('active');
        botoes[1].classList.remove('active');
      } else {
        formCadastro.classList.remove('hidden');
        formLogin.classList.add('hidden');
        botoes[1].classList.add('active');
        botoes[0].classList.remove('active');
      }
    }

    // Processa o envio do Formulário de Login
    function realizarLogin(evento) {
      evento.preventDefault(); // Impede o recarregamento padrão da página
      const email = document.getElementById('loginEmail').value;
      const nomeSimulado = email.split('@')[0]; // Extrai o nome do e-mail

      exibirPassaporte(nomeSimulado);
    }

    // Processa o envio do Formulário de Cadastro
    function realizarCadastro(evento) {
      evento.preventDefault();
      const nome = document.getElementById('cadNome').value;

      exibirPassaporte(nome);
    }

    

    // Mostra o Passaporte do Usuário e esconde os formulários
    function exibirPassaporte(nome) {
      document.getElementById('formLogin').classList.add('hidden');
      document.getElementById('formCadastro').classList.add('hidden');
      document.getElementById('tabNav').classList.add('hidden');

      // Atualiza o crachá com os dados fornecidos
      document.getElementById('exibeNomeUsuario').innerText = nome.startsWith('@') ? nome : '@' + nome;
      document.getElementById('cartaoPassaporte').style.display = 'block';
    }

    // Reseta a tela para o estado inicial
    function sairApp() {
      document.getElementById('cartaoPassaporte').style.display = 'none';
      document.getElementById('tabNav').classList.remove('hidden');
      alternarAba('login');
    }
  </script>
</body>
</html>
